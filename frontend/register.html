<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - WorkVoice AI</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/register.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            WorkVoice <span>AI</span>
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>


    <!-- REGISTER -->

    <main class="register-page">

        <div class="register-container">

            <div class="register-header">

                <h1>
                    Create Your
                    <span>WorkVoice</span>
                    Account
                </h1>

                <p>
                    Join WorkVoice AI and make your
                    workplace voice heard.
                </p>

            </div>


            <form
                id="registerForm"
                class="register-form"
            >

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Contact Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your contact number"
                        maxlength="15"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="role">
                        Register As
                    </label>

                    <select id="role" required>

                        <option value="">
                            Select your role
                        </option>

                        <option value="worker">
                            Worker
                        </option>

                        <option value="owner">
                            Owner
                        </option>

                    </select>

                </div>


                <!-- MESSAGE -->

                <p
                    id="registerMessage"
                    class="register-message"
                ></p>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="register-button"
                >
                    Create Account
                </button>

            </form>


            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </main>


    <script src="js/register.js"></script>

</body>

</html>
